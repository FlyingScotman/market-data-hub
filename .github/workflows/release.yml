# Release of a signed bundle (ADMIN_DESIGN §6.1, README_DEPLOY §11). Two ways to start it:
#
#   * the owner pushes a tag:  git tag v0.7.0 && git push origin v0.7.0
#   * Actions -> release -> "Run workflow" on main with the field `version` filled in (X.Y.Z or
#     X.Y.Z{a|b|rc}N): the owner, or a session by the owner's direct request, starts it; the tag v<version>
#     is made by the release itself, on the commit that was built, only after the signature was made and
#     verified (as the releases of the monitor and the adapter do). A tag made with GITHUB_TOKEN does not
#     start this workflow a second time.
#
#   check    Run workflow only: started on main, the version is well formed, greater than the latest tag
#            v*, and neither the tag nor the release exists yet (fails in seconds, before the tests)
#   ci       tests, ruff, mypy (ci.yml)
#   build    deploy/make_bundle.sh --code-only -> market-data-hub-X.Y.Z.tar.gz + .SHA256SUMS
#            (the version must equal the package version from importlib.metadata; on Run workflow the
#            commit gets the tag v<version> in this job's checkout ONLY, never pushed, so that hatch-vcs,
#            make_bundle.sh and the .git_archival.txt of the archive see what they see on a tag build)
#   sign     environment `release` (required reviewers: the owner approves in the Actions tab):
#            minisign -S over the SHA256SUMS. The secret key is handed to the minisign binary only: no
#            checkout, no Python, no project dependencies in this job
#   verify   mdhub release verify against deploy/release-keys/ of the built commit
#   publish  GitHub Release with the archive, SHA256SUMS and SHA256SUMS.minisig; on Run workflow it also
#            creates the tag v<version> on the built commit (github.sha), so a release that failed before
#            this point leaves no tag
#
# Jobs get the least permissions they need; only `publish` can write to the repository, and only it
# makes the tag. Run workflow needs the environment `release` to accept the branch main and GitHub
# Actions in the bypass list of the tag ruleset (README_DEPLOY §11).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "release version X.Y.Z or X.Y.Z{a|b|rc}N; the tag v<version> is made on main by the release"
        required: true
        type: string

permissions: {}

env:
  # the tag of this run: the pushed tag, or v<version> of Run workflow (a value, never part of a script)
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Run workflow releases main only
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run workflow releases main only; this run was started on $GITHUB_REF. Start it again with 'Use workflow from: main'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # all tags: the version must be greater than the latest one
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: github.event_name == 'workflow_dispatch'
        with:
          enable-cache: false
      - name: version is well formed and greater than the latest tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv sync --frozen
          uv run --frozen python - <<'PY'
          import os
          import subprocess
          import sys

          from mdhub.release import ReleaseError, version_key

          version = os.environ["VERSION"]
          try:
              new = version_key(version)
          except ReleaseError:
              print("::error::version must be X.Y.Z or X.Y.Z{a|b|rc}N (no leading v, no zeros in front of a number)")
              sys.exit(1)
          tags = subprocess.run(
              ["git", "tag", "--list", "v*"], check=True, capture_output=True, text=True
          ).stdout.split()
          latest = None
          for tag in tags:
              try:
                  key = version_key(tag[1:])
              except ReleaseError:
                  continue  # not a release tag
              if latest is None or key > latest[0]:
                  latest = (key, tag)
          if latest is not None and new <= latest[0]:
              print(f"::error::version {version} is not greater than the latest tag {latest[1]}")
              sys.exit(1)
          print(f"ok: {version} is greater than the latest tag {latest[1] if latest else '(none)'}")
          PY
      - name: tag and release do not exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::the tag $RELEASE_TAG exists already; choose a greater version"
            exit 1
          fi
          if out="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "::error::a release $RELEASE_TAG exists already; choose a greater version"
            exit 1
          fi
          if ! grep -qi 'release not found' <<<"$out"; then
            echo "::error::could not tell whether the release exists: ${out:0:200}"
            exit 1
          fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run workflow: exactly the commit that started the run; a pushed tag: the default
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run workflow - this commit is v<version> in this checkout only
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::the checkout is not the commit that started the run"
            exit 1
          fi
          # a lightweight tag, local to this job and never pushed: the version of hatch-vcs, the
          # `git describe --exact-match` of make_bundle.sh and the .git_archival.txt of the archive
          # are then exactly those of a build from a pushed tag
          git tag "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: tag matches the package version
        id: version
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::tag $RELEASE_TAG is not vX.Y.Z or vX.Y.Z{a|b|rc}N"; exit 1
          fi
          package="$(uv run --frozen python -c 'import importlib.metadata as m; print(m.version("market-data-hub"))')"
          if [[ "$version" != "$package" ]]; then
            echo "::error::tag $RELEASE_TAG but the package version is $package"; exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: code-only bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deploy/make_bundle.sh --code-only --version "$VERSION"
          uv run --frozen mdhub release verify "dist/market-data-hub-$VERSION.tar.gz" --allow-unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            dist/market-data-hub-${{ steps.version.outputs.version }}.tar.gz
            dist/market-data-hub-${{ steps.version.outputs.version }}.SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
      - name: install minisign
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends minisign
      - name: sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" \
            -m "dist/market-data-hub-$VERSION.SHA256SUMS" \
            -t "market-data-hub $VERSION $GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/market-data-hub-${{ needs.build.outputs.version }}.SHA256SUMS.minisig
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: mdhub release verify (pinned keys of this commit)
        run: |
          uv sync --frozen
          uv run --frozen mdhub release keys --keys-dir deploy/release-keys
          uv run --frozen mdhub release verify "dist/market-data-hub-$VERSION.tar.gz" \
            --keys-dir deploy/release-keys

  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then pre=(--prerelease); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # the tag does not exist: the release makes it on the commit that was built, signed and
            # verified (with an existing tag, --target would be ignored: refuse that case)
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::the tag $RELEASE_TAG appeared while the release was running; nothing was published"
              exit 1
            fi
            where=(--target "$GITHUB_SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${where[@]}" "${pre[@]}" \
            --title "market-data-hub $VERSION" --generate-notes \
            "dist/market-data-hub-$VERSION.tar.gz" \
            "dist/market-data-hub-$VERSION.SHA256SUMS" \
            "dist/market-data-hub-$VERSION.SHA256SUMS.minisig"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::the tag $RELEASE_TAG points to $tagged, not to the built commit $GITHUB_SHA: do not install this release"
              exit 1
            fi
          fi
