# Tests and lint on every push and pull request; also called by release.yml before a release.
#
# Same commands as on a developer machine: uv sync --frozen, ruff, mypy (strict), pytest with
# pgserver (PostgreSQL 16 from the wheel, no service container). minisign is installed so the
# release interop tests run (tests/test_release.py). No secrets are used here.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: the version comes from git (hatch-vcs)
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: minisign (release interop tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends minisign
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
