# PostgreSQL 16 settings for market-data-hub on a 4 GB RAM / 2-4 vCPU / SSD VPS.
# Used by docker-compose (mounted as /etc/postgresql/postgresql.conf) and by install.sh
# (copied to /etc/postgresql/16/main/conf.d/mdhub.conf, where listen_addresses is overridden
# to localhost). Workload: append-mostly loaders, a few concurrent readers, nightly pg_dump.

# --- connections ------------------------------------------------------------------------
listen_addresses = '*'                  # container network only; host port bound to 127.0.0.1
port = 5432
max_connections = 60                    # scheduler pool (~10) + api workers + admin
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'

# --- memory (4 GB host, Postgres shares it with worker + api) -----------------------------
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 16MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB
wal_buffers = 16MB
huge_pages = try

# --- WAL / checkpoints ------------------------------------------------------------------
wal_level = replica
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on

# --- planner (SSD) ----------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# --- parallelism ------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- autovacuum (large append-mostly tables: ops.raw_capture, md.*) -----------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_vacuum_cost_limit = 1000

# --- logging (stderr -> docker json-file / journald) -------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000       # ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s

# --- locale / time ----------------------------------------------------------------------
timezone = 'UTC'                        # application sessions also SET TIME ZONE 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# --- statements statistics ---------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
