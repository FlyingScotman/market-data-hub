# This file belongs in /etc/nginx/sites-available/hub.example.com.
# Request paths, query strings, cookies and authorization are excluded from logs.
log_format mdhub_safe '$remote_addr [$time_local] $request_method $status '
                     '$body_bytes_sent $request_time';

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.example.com;

    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MDHUB:10m;
    ssl_session_tickets off;
    server_tokens off;

    access_log /var/log/nginx/marketdatahub-access.log mdhub_safe;
    # nginx error messages can contain enrollment URLs; keep this site's error log off disk.
    error_log /dev/null crit;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host hub.example.com;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace client-supplied forwarding headers instead of appending them.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    location /v1/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8080;
    }

    location /health/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /updates/upload {
        client_max_body_size 201m;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
