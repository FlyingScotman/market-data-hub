# HTTP serves certificate validation and redirects browsers to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name marketdatahub.cc;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://marketdatahub.cc$request_uri;
    }
}
