[project]
name = "market-data-hub"
dynamic = ["version"]
description = "Market data hub: loaders, schedule and PostgreSQL store for MOEX/CBR/ECB/Ratescalcs data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FiveLimaGolf" }]
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2024.1",
]

[project.scripts]
mdhub = "mdhub.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
  "respx>=0.21,<1",
  "pgserver>=0.1.4",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mdhub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mdhub"]

[tool.hatch.build.targets.sdist]
include = ["/src/mdhub", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Never reformat audits, data or hand-off material (ruff also formats code in Markdown).
extend-exclude = ["docs/audit", "docs/STATUS.md", "data", ".handoff"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "C4", "PT", "RET", "TID"]
ignore = [
  "S101",   # assert in tests / invariants
  "S608",   # SQL built from validated identifiers via psycopg.sql
  "RUF001", # Cyrillic text in strings is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mdhub"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pgserver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
  "live: hits real network endpoints (requires credentials, opt-in with -m live)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
