[project]
name = "market-data-hub"
dynamic = ["version"]
description = "Market data hub: loaders, schedule and PostgreSQL store for MOEX/CBR/ECB/Ratescalcs data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FlyingScotman" }]
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2024.1",
  "cryptography>=43,<47",
  "jinja2>=3.1,<4",
  "argon2-cffi>=23.1,<26",
  "webauthn>=2.2,<3",
  "python-multipart>=0.0.9",
  "psutil>=6,<8",
  "jsonschema>=4.23,<5",
  "jsonschema-rs==0.59.0",
]

[project.scripts]
mdhub = "mdhub.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
  "respx>=0.21,<1",
  "pgserver>=0.1.4",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pyyaml>=6.0.3",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version from git tags vX.Y.Z (untagged commits: X.Y.Z+1.devN+g<hash>). A `git archive`
# (bundle) carries it in .git_archival.txt (export-subst); without git metadata the build
# falls back to 0.0.0 unless SETUPTOOLS_SCM_PRETEND_VERSION is set (deploy/Dockerfile:
# build arg MDHUB_VERSION).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the editable install (and so its version) when the commit or tags change.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/mdhub"]

[tool.hatch.build.targets.wheel.force-include]
# Market Snapshot Contract v1 schemas (owned by the hub, kept at the repository root)
"schemas" = "mdhub/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/src/mdhub", "/schemas", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock",
]

[tool.mdhub.release]
# The oldest installed version a release of this tree can be installed over directly
# (MANIFEST.json min_previous_version, ADMIN_DESIGN §6.1). Raise it when an upgrade needs an
# intermediate release (e.g. a migration that expects an earlier data fix).
min_previous_version = "0.1.0"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Never reformat audits, data or hand-off material (ruff also formats code in Markdown).
extend-exclude = ["docs/audit", "docs/STATUS.md", "data", ".handoff"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "C4", "PT", "RET", "TID"]
ignore = [
  "S101",   # assert in tests / invariants
  "S608",   # SQL built from validated identifiers via psycopg.sql
  "RUF001", # Cyrillic text in strings is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mdhub"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pgserver.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
  "live: hits real network endpoints (requires credentials, opt-in with -m live)",
]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  # fastapi.testclient -> starlette.testclient: "Using `httpx` ... is deprecated" (upstream)
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
