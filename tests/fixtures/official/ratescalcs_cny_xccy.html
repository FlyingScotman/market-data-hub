<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNY XCCY Curve Editor</title>
<style>

* { box-sizing: border-box; }
body {
    background: #0c0c0c;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    padding: 16px;
    margin: 0;
}
a { color: #39ff14; }
hr { border: none; border-top: 1px solid #ffffff; margin: 8px 0; }

h2 { margin: 0 0 10px 0; font-size: 14px; }
textarea {
    background: #111;
    color: #ffffff;
    border: 1px solid #ffffff;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    width: 320px;
    resize: vertical;
    outline: none;
}
.btn {
    display: block;
    margin-top: 8px;
    background: transparent;
    color: #ffffff;
    border: 1px solid #ffffff;
    padding: 5px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
}
.btn:hover { background: #1a1a1a; }
.footer { margin-top: 14px; opacity: 0.45; font-size: 12px; }
</style>
</head>
<body>
<h2>CNY XCCY Curve Editor</h2>

<form method="post">
    <textarea name="content" rows="22">on 0.1 0.3
1w 0.50 1.45 
2w 1.00 1.95 
1m 2.40 3.10 
2m 3.50 4.20 
3m 4.80 5.50 
6m 6.30 7.00 
9m 7.20 7.90 
12m 7.80 8.70</textarea>
    <button class="btn" type="submit">Save</button>
</form>
<div class="footer"><a href=".">← Dashboard</a></div>
</body>
</html>
